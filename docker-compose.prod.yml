# Production compose override. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Required environment variables (inject via ECS task secrets / SSM / .env file — never commit):
#   DJANGO_SECRET_KEY        — real random secret key
#   DJANGO_ALLOWED_HOSTS     — comma-separated hostnames, e.g. api.example.com
#   POSTGRES_PASSWORD        — real DB password
#   ESIGN_WEBHOOK_SECRET     — real webhook HMAC secret
#   INITIAL_ADMIN_EMAIL      — bootstrap admin email
#   INITIAL_ADMIN_PASSWORD   — bootstrap admin password (change after first login)
#   AWS_STORAGE_BUCKET_NAME  — S3 bucket for document uploads (optional; unset = local)
#   AWS_S3_REGION_NAME       — S3 region (if using S3)
#
# See env.example for the full variable reference.

services:
  backend:
    build:
      context: ./backend
      target: prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "false"
      # Secrets must be injected at runtime — no defaults here.
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      ESIGN_WEBHOOK_SECRET: ${ESIGN_WEBHOOK_SECRET}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
