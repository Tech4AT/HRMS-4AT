# Full-stack, production-shaped setup: three separate services.
#
#   docker compose up --build
#
# Frontend: http://localhost:3001   Backend/API: http://localhost:3000
# (The single-container alternative is the root Dockerfile; backend/docker-compose.yml
#  is a DB-only helper for running the backend locally without containers.)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
    # The DB is reached by the backend over the compose network (db:5432); no
    # host port is needed. To inspect it from the host, uncomment and pick a
    # free port, e.g.:
    #   ports:
    #     - "55432:5432"
    volumes:
      - hrms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: demo-only-change-me
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      INITIAL_ADMIN_EMAIL: admin@hrms.local
      INITIAL_ADMIN_PASSWORD: Admin12345!
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Mount the docs/ folder (always exists) read-only. Co-devs drop the real HR
      # export at docs/roster.xlsx (gitignored PII); present -> real data, absent -> demo.
      # ':ro,Z' — Z relabels for SELinux hosts (Fedora/RHEL) so the container can read it.
      - "./docs:/data/docs:ro,Z"

  frontend:
    build: ./frontend
    environment:
      # Server-side (route handlers) reach the backend over the compose network.
      BACKEND_API_URL: http://backend:3000/api/v1
      MOCK_AUTH: "false"
    depends_on:
      - backend
    ports:
      - "3001:3001"
    # No restart policy meant a crashed frontend stayed down permanently (port
    # freed, browser/curl checks against :3001 silently hit whatever else
    # picked it up) — a client stuck on "Loading..." looked like an app bug
    # but was actually "there is no server behind this port any more."
    restart: unless-stopped

volumes:
  hrms_pgdata:
